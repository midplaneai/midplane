name: engine-test

# CI for the engine subtree (engine/). Runs only when engine files change, so a
# control-plane-only PR doesn't pay for it. The control-plane suite runs under
# vitest (see CONTRIBUTING.md); the engine runs under bun:test.

# Triggers include the repo-root build inputs because engine/docker/Dockerfile
# builds from the root: a bun.lock / root-manifest / bunfig change can break the
# compiled engine image without touching engine/**, so it must run docker-build.
on:
  push:
    branches: [main]
    paths:
      - "engine/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "apps/web/package.json"
      - "packages/*/package.json"
      - "infra/*/package.json"
      - ".github/workflows/engine-test.yml"
  pull_request:
    branches: [main]
    paths:
      - "engine/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "apps/web/package.json"
      - "packages/*/package.json"
      - "infra/*/package.json"
      - ".github/workflows/engine-test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3
      - run: bun install
      # Scope bun:test to engine/ — from the repo root `bun test` would discover
      # the control-plane vitest files (which import `vitest`, not `bun:test`).
      - name: engine bun:test
        run: cd engine && bun test

  # The masking source-rewrite live harness (ET7) runs the SHIPPED rewriter +
  # catalog + transform SQL + salt GUC against a real Postgres 16, and includes the
  # operator-shadow covert-channel exploit PoC (Codex High). It's gated on
  # MASKING_LIVE_PG_DSN so the plain `bun test` job above skips it (no DB there); this
  # job supplies the DB so the security-critical live behavior is actually exercised.
  live-masking:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: probe
          POSTGRES_DB: probe
        ports:
          - 5432:5432
        # Wait until the server accepts connections before the steps run.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3
      - run: bun install
      - name: engine masking live-PG harness
        working-directory: engine
        env:
          MASKING_LIVE_PG_DSN: postgres://postgres:probe@127.0.0.1:5432/probe
        run: bun test packages/engine/test/masking/source-rewrite.live.test.ts

  smoketest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3
      - run: bun install
      - name: Build and run smoketest
        working-directory: engine/examples/smoketest
        run: ./run.sh

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3
      - run: bun install --frozen-lockfile
      - name: Build image and run MCP trial battery against sidecar Postgres
        # test-image.sh cd's into engine/ itself and builds from the repo root.
        run: bash engine/scripts/test-image.sh

  # The `midplane` npm package runs under Node, which the bun:test job above
  # cannot speak to at all: it proves the SOURCE works under Bun, and every
  # interesting difference (node:sqlite instead of bun:sqlite, libpg-query's
  # WASM loading from node_modules, the bundled single-file entry) exists only
  # in the built artifact on the other runtime. So build the real package and
  # drive the real bin over stdio against a real Postgres.
  #
  # The matrix is the supported floor and the current LTS. 22.16 is the floor
  # because node:sqlite is unavailable below it, which is a boot failure rather
  # than a degraded mode — package.json's engines.node says the same thing.
  node-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.16", "22", "24"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: probe
          POSTGRES_DB: probe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      # Bun builds the bundle; Node runs it. That split is the point.
      - name: Build the npm package
        run: bun engine/packages/mcp-server/scripts/build-npm.ts
      - name: Smoke the built package under Node
        working-directory: engine/packages/mcp-server
        env:
          SMOKE_DATABASE_URL: postgres://postgres:probe@127.0.0.1:5432/probe
        run: node scripts/smoke-npm-package.mjs
      # `npm pack` resolves the "files" list and bin the same way `npm publish`
      # will, so a tarball missing dist/ or a bin pointing at nothing fails here
      # rather than on a user's first `npx`.
      - name: Verify the publishable tarball
        working-directory: engine/packages/mcp-server
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e '
            const [p] = require("/tmp/pack.json");
            const files = p.files.map((f) => f.path);
            const missing = ["dist/cli.js", "package.json", "README.md", "LICENSE"]
              .filter((f) => !files.includes(f));
            if (missing.length) {
              console.error("tarball is missing:", missing.join(", "));
              console.error("contains:", files.join(", "));
              process.exit(1);
            }
            console.log(`${p.name}@${p.version}: ${files.length} files, ${p.unpackedSize} bytes unpacked`);
          '
