# Deploy midplane-cloud to Fly — manual rollout of an OSS engine image.
#
# WHAT THIS DOES
#   Rolls out a single, already-published OSS engine image tag
#   (midplane/midplane:<image_tag>) across the EU and/or US regions in one
#   reviewed, logged run. Per region, in order, it:
#     1. Stages the MIDPLANE_OSS_IMAGE secret on the control-plane (web) app.
#     2. Deploys the web app with a health-gated `--strategy bluegreen` cutover
#        so the new secret + image go live only if /api/health passes
#        (Fly auto-rolls-back if the green machines never become healthy).
#     3. (opt-in) Drains running customer engine machines so customers move onto
#        the new image now instead of "eventually" (on idle-cycle respawn).
#
#   It does NOT build or publish midplane/midplane — that image is produced by
#   the separate midplaneai/midplane repo's `v*`-tag CI. This workflow only
#   CONSUMES an already-published tag.
#
# WHY THERE IS NO `fly deploy` OF THE ENGINE APPS (midplane-eu / midplane-us)
#   Those apps never run a `fly deploy` release machine. Live customer traffic
#   runs on machines created on demand via the Fly Machines API by
#   FlyMachineSpawner (packages/router/src/spawner-fly.ts), each with a per-
#   machine DATABASE_URL + policy file, using the MIDPLANE_OSS_IMAGE secret set
#   on the WEB app. So the engine version customers get is governed entirely by
#   that secret. A `fly deploy` of an engine toml would only launch a release
#   machine with NO DATABASE_URL/policy (the toml omits them by design), so it
#   can never pass /health — and it would reconcile against the live on-demand
#   machines sharing the app. We therefore touch the engine apps ONLY for the
#   optional drain. Updating the secret affects NEWLY spawned machines; already-
#   running ones keep the old image until they respawn — hence the drain step.
#
# REQUIRED GitHub configuration (none of these values live in this repo)
#   Secrets — repo-level OR on the "production" Environment:
#     FLY_API_TOKEN
#       Fly token that can deploy the web apps (midplane-web, midplane-web-us)
#       and, for the optional drain, list/destroy machines on the engine apps
#       (midplane-eu, midplane-us). An org-scoped token covers all four.
#       flyctl reads it from env.
#   No build-time variables: the Better Auth client is same-origin (nothing
#   public is baked into the bundle). Runtime auth secrets (BETTER_AUTH_SECRET,
#   MIDPLANE_REGION_COOKIE_SECRET) are persistent Fly secrets on each web app,
#   set out-of-band via `flyctl secrets set` (see fly-web-*.toml).
#
# This is workflow_dispatch ONLY — there is intentionally no push/merge trigger.
# The web app is built from whatever ref you dispatch from (default branch HEAD
# by default), so dispatch from the commit you want live.
name: Deploy to Fly

run-name: "Deploy midplane/midplane:${{ inputs.image_tag }} → ${{ inputs.region }} (drain=${{ inputs.drain_engines }})"

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "OSS engine image tag to roll out, i.e. the X.Y.Z in midplane/midplane:X.Y.Z."
        type: string
        required: true
        # Default mirrors OSS_ENGINE_IMAGE (packages/router/src/oss-image.ts);
        # scripts/check-image-pin.ts enforces it matches the rest of the repo.
        default: "0.20.0"
      region:
        description: "Region(s) to roll out. With 'both', eu rolls fully before us (staged blast radius)."
        type: choice
        required: true
        default: both
        options:
          - both
          - eu
          - us
      drain_engines:
        description: "Force running customer engine machines off the old image NOW by destroying them (router respawns on the new image) instead of waiting for their idle cycle. NOT seamless: in-flight MCP calls are dropped, the first request per project may 502, and active sessions must re-initialize. Leave OFF unless a continuously-busy project must move immediately."
        type: boolean
        required: true
        default: false
      allow_engine_pin_mismatch:
        description: "Escape hatch: roll out an image_tag that DISAGREES with the dispatched ref's OSS_ENGINE_IMAGE. Normally this combination is refused (see the pin-agreement preflight). Only for a deliberate incident action where you have reasoned about which policies the two versions can load. Leave OFF."
        type: boolean
        required: true
        default: false

concurrency:
  # One Fly rollout at a time. Do NOT cancel an in-flight deploy mid-bluegreen —
  # a second dispatch queues behind the first instead.
  group: deploy-fly
  cancel-in-progress: false

jobs:
  # Fail fast on a typo'd tag BEFORE the (optionally reviewer-gated) deploy job
  # is created — so a bad tag never bothers a human approver. Needs no secrets,
  # so it runs outside the production Environment.
  preflight:
    name: Verify image exists (multi-arch)
    runs-on: ubuntu-latest
    outputs:
      # Immutable manifest-list digest of inputs.image_tag. The deploy job stages
      # MIDPLANE_OSS_IMAGE as repo:tag@digest so what customers run is byte-exact
      # rather than "whatever that tag points at when a machine happens to spawn".
      digest: ${{ steps.inspect.outputs.digest }}
    steps:
      - name: Checkout (read the dispatched ref's engine pin)
        uses: actions/checkout@v5

      # The engine version and the web code are ONE release, but nothing used to
      # say so: image_tag is a free-form dispatch string whose `default:` merely
      # mirrors the pin, and the rest of preflight only proves the tag exists in
      # the registry. Nothing compared it against the ref actually being built.
      # The bluegreen cutover can't catch the mismatch either — it gates on
      # /api/health, which is process liveness and never spawns an engine or
      # loads a policy. So a web-at-HEAD / engine-one-release-back rollout went
      # fully green and only failed later, on a customer's first policy save.
      #
      # That failure is not recoverable by retrying. saveDatabasePolicy commits
      # project_databases BEFORE the hot push and deliberately skips the respawn
      # fallback on a reject (a cold spawn would re-read the same rejected
      # config), so a policy carrying a requires_features token the running
      # engine doesn't know leaves that project unable to start until the engine
      # is upgraded. Refusing the rollout is much cheaper than unwinding it.
      - name: Engine pin agrees with the dispatched ref
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          ALLOW_MISMATCH: ${{ inputs.allow_engine_pin_mismatch }}
        run: |
          set -euo pipefail
          PIN_FILE="packages/router/src/oss-image.ts"
          # Same shape scripts/check-image-pin.ts parses: the SSOT constant, tag
          # part only. Anchored to the export so a version quoted inside the
          # file's long explanatory comment can't be picked up instead, and
          # tolerant of a trailing @sha256: the way the drift check's
          # split("@")[0] is, so committing a digest here degrades to a normal
          # comparison rather than an unparseable-file failure.
          PIN_VERSION="$(sed -n 's/^export const OSS_ENGINE_IMAGE = "midplane\/midplane:\([0-9][0-9.]*\)[^"]*".*/\1/p' "$PIN_FILE")"
          if [ -z "$PIN_VERSION" ]; then
            echo "::error::could not parse OSS_ENGINE_IMAGE out of $PIN_FILE. If the constant's shape changed, update this check — do not delete it."
            exit 1
          fi
          echo "Dispatched ref pins: $PIN_VERSION"
          echo "Requested image_tag: $IMAGE_TAG"

          if [ "$PIN_VERSION" = "$IMAGE_TAG" ]; then
            echo "OK: engine pin and requested tag agree."
            exit 0
          fi

          if [ "$ALLOW_MISMATCH" = "true" ]; then
            echo "::warning::Rolling out engine $IMAGE_TAG against a ref that pins $PIN_VERSION (allow_engine_pin_mismatch=true). The web code and the engine are from different releases."
            {
              echo "## ⚠ Engine pin mismatch (explicitly allowed)"
              echo ""
              echo "- **Ref pins:** \`$PIN_VERSION\`"
              echo "- **Rolling out:** \`$IMAGE_TAG\`"
              echo ""
              echo "A policy this web version writes may name an enforcement feature this engine does not support. The engine refuses the whole policy, and the refusal is not self-healing."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::error::Engine pin mismatch. This ref pins midplane/midplane:$PIN_VERSION but the rollout requested :$IMAGE_TAG. Dispatch from the commit whose OSS_ENGINE_IMAGE matches the engine you mean to run — a legitimate rollback re-deploys a matching ref, so it needs no override. If you genuinely intend to split them, re-run with allow_engine_pin_mismatch=true."
          exit 1

      - name: Inspect midplane/midplane:${{ inputs.image_tag }} on Docker Hub
        id: inspect
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          REF="midplane/midplane:$IMAGE_TAG"
          echo "Inspecting $REF ..."
          if ! RAW="$(docker buildx imagetools inspect "$REF" --raw 2>/dev/null)"; then
            echo "::error::$REF not found on Docker Hub. Check the tag — the image is published by the midplaneai/midplane v*-tag CI, not by this repo."
            exit 1
          fi
          MEDIA="$(echo "$RAW" | jq -r '.mediaType')"
          echo "Top-level mediaType: $MEDIA"
          # Must be a manifest list / OCI index (multi-arch), not a single image.
          # A plain local build yields a single-arch / attestation-only image
          # that Fly rejects, so we gate on this explicitly.
          case "$MEDIA" in
            *manifest.list*|*image.index*) ;;
            *)
              echo "::error::$REF is not a multi-arch manifest list (got mediaType=$MEDIA). Re-publish via the v*-tag CI (provenance:false)."
              exit 1
              ;;
          esac
          PLATFORMS="$(echo "$RAW" | jq -r '.manifests[]? | select(.platform.os != null and .platform.os != "unknown") | "\(.platform.os)/\(.platform.architecture)"' | sort -u)"
          echo "Platforms in manifest:"
          echo "$PLATFORMS" | sed 's/^/  - /'
          if ! echo "$PLATFORMS" | grep -qx "linux/amd64"; then
            echo "::error::$REF has no linux/amd64 image (arm64-only?). Fly runs amd64 — this tag would not boot."
            exit 1
          fi
          echo "OK: $REF is a multi-arch manifest list with linux/amd64."

          # --- Resolve the immutable manifest-list digest -------------------
          # Read it from the registry's own Docker-Content-Digest header rather
          # than hashing the --raw bytes (a stray trailing newline from the CLI
          # would silently yield a digest that resolves to nothing) or parsing
          # `imagetools inspect --format`, whose output shape varies by buildx
          # version. This header is exactly what a `@sha256:` pull resolves on.
          ACCEPT='application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json'

          manifest_digest() { # $1 = token URL, $2 = registry host, $3 = repo
            local tok
            tok="$(curl -fsS "$1" | jq -r '.token // .access_token')"
            curl -fsS -I \
              -H "Authorization: Bearer $tok" \
              -H "Accept: $ACCEPT" \
              "https://$2/v2/$3/manifests/$IMAGE_TAG" \
              | tr -d '\r' | awk 'tolower($1)=="docker-content-digest:"{print $2}'
          }

          # `|| true` so a curl/auth failure lands on the friendly error below
          # instead of tripping `set -e` with a bare exit code.
          DIGEST="$(manifest_digest \
            "https://auth.docker.io/token?service=registry.docker.io&scope=repository:midplane/midplane:pull" \
            "registry-1.docker.io" "midplane/midplane" || true)"
          case "$DIGEST" in
            sha256:*) ;;
            *)
              echo "::error::could not resolve a manifest digest for $REF (got '$DIGEST')."
              exit 1
              ;;
          esac
          echo "Docker Hub digest: $DIGEST"

          # --- The GHCR mirror must agree, byte for byte -------------------
          # Prod runs MIDPLANE_ENGINE_USE_GHCR=1, so FlyMachineSpawner rewrites
          # the staged ref to ghcr.io/midplaneai/midplane and CARRIES THE DIGEST
          # ACROSS. engine-publish.yml pushes both registries from one
          # build-push-action, so the digests are the same by construction — but
          # if that ever stops being true, a digest-pinned ref becomes unpullable
          # from GHCR and EVERY machine create fails. Catch it here, where it
          # costs a red preflight, instead of in prod on the first cold spawn.
          if ! GHCR_DIGEST="$(manifest_digest \
                "https://ghcr.io/token?service=ghcr.io&scope=repository:midplaneai/midplane:pull" \
                "ghcr.io" "midplaneai/midplane")"; then
            echo "::error::ghcr.io/midplaneai/midplane:$IMAGE_TAG is not pullable. engine-publish.yml pushes it alongside Docker Hub; prod pulls from GHCR (MIDPLANE_ENGINE_USE_GHCR=1), so this tag would fail every machine create. Check the publish run and that the GHCR package is Public."
            exit 1
          fi
          if [ "$GHCR_DIGEST" != "$DIGEST" ]; then
            echo "::error::GHCR and Docker Hub disagree on :$IMAGE_TAG (ghcr=$GHCR_DIGEST hub=$DIGEST). The two registries are supposed to receive one identical push; a digest-pinned rollout cannot be pulled from both. Re-publish the tag."
            exit 1
          fi
          echo "GHCR digest matches."

          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

  deploy:
    name: Roll out
    needs: preflight
    runs-on: ubuntu-latest
    # Gate the rollout behind the "production" Environment so a required
    # reviewer can be added later (Settings -> Environments -> production).
    # Until a reviewer is configured this still runs straight through.
    environment: production
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      # Tag AND digest. The tag keeps the ref readable in logs, `fly secrets
      # list`, and the audit trail; the digest is what actually gets pulled, so a
      # re-pushed tag can no longer change what customers run between the
      # preflight check and a machine spawning days later. FlyMachineSpawner
      # accepts this ref verbatim (normalizeImageRef drops the digest before
      # comparing, so adoption/staleness are unaffected) and ghcrEngineRef
      # carries the digest across when the GHCR bypass is on.
      IMAGE_REF: "midplane/midplane:${{ inputs.image_tag }}@${{ needs.preflight.outputs.digest }}"
      REGION_INPUT: ${{ inputs.region }}
      DRAIN: ${{ inputs.drain_engines }}
    steps:
      - name: Checkout (fly-*.toml configs + apps/web Dockerfile build context)
        uses: actions/checkout@v5

      - name: Preconditions
        run: |
          set -euo pipefail
          if [ -z "${FLY_API_TOKEN:-}" ]; then
            echo "::error::FLY_API_TOKEN is not set. Add it as a repo or 'production' Environment secret."
            exit 1
          fi
          # IMAGE_REF is assembled from a preflight job output. If that output
          # ever goes missing the ref degrades to a trailing-"@" string that no
          # registry resolves, and the failure would surface as a broken pull on
          # the first customer spawn rather than here. Assert the shape instead.
          case "$IMAGE_REF" in
            midplane/midplane:*@sha256:*) ;;
            *)
              echo "::error::IMAGE_REF is not tag+digest qualified (got '$IMAGE_REF'). The preflight digest output is missing."
              exit 1
              ;;
          esac
          echo "Rolling out $IMAGE_REF"

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Roll out ${{ env.IMAGE_REF }} to ${{ inputs.region }}
        run: |
          set -euo pipefail

          # Ordered region list — eu always rolls before us so the blast radius
          # is staged. A failure in eu aborts the run (set -e) before us starts.
          case "$REGION_INPUT" in
            eu)   REGIONS="eu" ;;
            us)   REGIONS="us" ;;
            both) REGIONS="eu us" ;;
            *) echo "::error::unknown region '$REGION_INPUT'"; exit 1 ;;
          esac

          # Start the run summary (appended per-region as each completes, so a
          # mid-run failure still shows what got through).
          {
            echo "## Fly rollout"
            echo ""
            echo "- **Image:** \`$IMAGE_REF\`"
            echo "- **Region input:** \`$REGION_INPUT\` (order: $REGIONS)"
            echo "- **Drain engines:** \`$DRAIN\`"
            echo ""
            echo "| Region | Web app | Engine drain |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          for region in $REGIONS; do
            case "$region" in
              eu)
                WEB_APP="midplane-web";    WEB_CONFIG="fly-web-eu.toml"
                ENGINE_APP="midplane-eu" ;;
              us)
                WEB_APP="midplane-web-us"; WEB_CONFIG="fly-web-us.toml"
                ENGINE_APP="midplane-us" ;;
            esac

            echo "::group::[$region] Stage MIDPLANE_OSS_IMAGE=$IMAGE_REF on $WEB_APP"
            # --stage defers application to the bluegreen deploy below, so the
            # secret goes live through the health-gated cutover rather than via
            # the immediate (ungated) restart that a plain `secrets set` triggers.
            flyctl secrets set --app "$WEB_APP" --stage \
              "MIDPLANE_OSS_IMAGE=$IMAGE_REF"
            echo "::endgroup::"

            echo "::group::[$region] Deploy web app $WEB_APP (bluegreen, health-gated)"
            # Builds apps/web/Dockerfile from the checked-out ref; the staged
            # secret is applied to the green machines and only cut over if
            # /api/health passes. No build args — the Better Auth client is
            # same-origin (nothing public baked into the bundle).
            flyctl deploy \
              --config "$WEB_CONFIG" \
              --app "$WEB_APP" \
              --strategy bluegreen
            echo "::endgroup::"

            # NOTE: we deliberately do NOT `fly deploy` the engine app
            # ($ENGINE_APP). It runs no release machine — a deploy would
            # launch one with no DATABASE_URL/policy that can never
            # pass /health, and would reconcile against the live on-demand
            # machines sharing the app. The engine version is governed by the
            # MIDPLANE_OSS_IMAGE secret staged above; the only legitimate
            # engine-app action is the optional drain below.

            drained="no"
            if [ "$DRAIN" = "true" ]; then
              echo "::group::[$region] Drain customer machines in $ENGINE_APP"
              # Customer-serving machines are spawned via the Machines API by
              # FlyMachineSpawner and named mcp-<projectId>. A `machine
              # restart` would NOT change their image (it reuses the stored
              # config) — only destroying them does.
              #
              # This is NOT seamless. The control-plane registry caches each
              # machine's 6PN IP and is not notified of an out-of-band destroy,
              # so after we kill a machine: any in-flight MCP call is dropped;
              # the FIRST request for that project 502s (upstream_disconnected)
              # because the registry still points at the dead IP, which then
              # invalidates the entry; the NEXT request respawns a fresh machine
              # on the new MIDPLANE_OSS_IMAGE; and the agent's MCP session is
              # gone, so a spec-compliant client must re-initialize. Idle
              # projects already cycle on their own 30-min idle timer — this
              # is the blunt "force a continuously-busy project now" path.
              # We touch ONLY mcp-* machines (the spawned customer engines),
              # never any other machine that might exist in the app.
              flyctl machine list --app "$ENGINE_APP" --json > "/tmp/machines-$region.json"
              IDS="$(jq -r '.[] | select(.name != null and (.name | startswith("mcp-"))) | .id' "/tmp/machines-$region.json")"
              if [ -z "$IDS" ]; then
                echo "No customer (mcp-*) machines in $ENGINE_APP — nothing to drain."
              else
                COUNT=0
                for id in $IDS; do
                  echo "Destroying $id (router respawns on the new image on next request)"
                  flyctl machine destroy "$id" --app "$ENGINE_APP" --force
                  COUNT=$((COUNT+1))
                done
                echo "Drained $COUNT customer machine(s) from $ENGINE_APP."
              fi
              drained="yes"
              echo "::endgroup::"
            fi

            echo "| $region | $WEB_APP (bluegreen) | $drained |" >> "$GITHUB_STEP_SUMMARY"
            echo "[$region] done."
          done

          echo "Rollout of $IMAGE_REF to [$REGIONS] complete."
