name: engine-publish

# Publishes one engine release as three artifacts, in dependency order:
#
#   publish   → midplane/midplane:<X.Y.Z> + :latest (Docker Hub + GHCR)
#   npm       → the `midplane` package on npmjs.com
#   registry  → the ai.midplane/midplane entry in the official MCP registry
#
# The registry entry is metadata ABOUT the other two — it names an npm version
# and an image tag, and the registry verifies both exist and carry proof of
# ownership before accepting it. So it runs last, and each job `needs:` the one
# before it: a failed image build must not leave a published npm package, and a
# failed npm publish must not leave a registry entry pointing at nothing.
#
# Monorepo note: engine releases are namespaced `engine-v*` so they don't
# collide with any control-plane release tag in the shared tag space. Push
# `engine-v0.11.0` to cut midplane/midplane:0.11.0. This is SEPARATE from the
# control-plane deploy (deploy-fly.yml, manual workflow_dispatch) — code-only
# merge keeps the two pipelines distinct.
#
# One-time setup this workflow assumes:
#   NPM_TOKEN                      npm token with publish rights on `midplane`.
#                                  Removable once trusted publishing (OIDC) is
#                                  configured — see the npm job below.
#   MCP_REGISTRY_DNS_PRIVATE_KEY   Ed25519 private key, HEX (64 chars), whose
#                                  public half is published as a TXT record at
#                                  the midplane.ai APEX:
#                                    midplane.ai. IN TXT "v=MCPv1; k=ed25519; p=<pubkey>"
#                                  That record is what entitles us to the
#                                  `ai.midplane/*` namespace.
#
#                                  THE TWO HALVES USE DIFFERENT ENCODINGS. The
#                                  public half is base64 because that is what
#                                  the TXT record carries; the private half is
#                                  hex because that is what `mcp-publisher login
#                                  dns --private-key` parses. Passing base64
#                                  there fails with
#                                  "invalid hex private key format".
#
#                                    openssl genpkey -algorithm Ed25519 -out key.pem
#                                    # public  -> DNS TXT (base64, 44 chars)
#                                    openssl pkey -in key.pem -pubout -outform DER | tail -c 32 | base64
#                                    # private -> this secret (hex, 64 chars)
#                                    openssl pkey -in key.pem -outform DER | tail -c 32 | xxd -p -c 64
#
#                                  Confirm the pair before a release — deriving
#                                  the public half from the private one must
#                                  reproduce what DNS serves:
#                                    { printf '302e020100300506032b657004220420' | xxd -r -p; \
#                                      echo -n "$PRIV_HEX" | xxd -r -p; } \
#                                      | openssl pkey -inform DER -pubout -outform DER \
#                                      | tail -c 32 | base64
#                                    dig +short TXT midplane.ai | tr -d '"' | sed -E 's/.*p=//'

on:
  push:
    tags:
      - "engine-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Engine version X.Y.Z to (re)publish, e.g. 0.10.0 (no engine-v prefix)."
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.tag }}
    permissions:
      contents: read
      # Push the same image to GHCR (ghcr.io/midplaneai/midplane) alongside
      # Docker Hub. The cloud FlyMachineSpawner pulls the GHCR tag when
      # MIDPLANE_ENGINE_USE_GHCR=1 so machine creates bypass Fly's Docker Hub
      # pull-through mirror (which has run out of disk and 500'd manifest
      # writes). GHCR is pulled directly by Fly. One-time: the GHCR package
      # must be set to Public so Fly can pull it without registry creds.
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        # On a tag push, strip the `engine-v` prefix → bare X.Y.Z. On a manual
        # workflow_dispatch GITHUB_REF is a BRANCH ref (refs/heads/...), so the
        # strip would yield an invalid Docker tag — use the required input instead.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.version }}"
          else
            tag="${GITHUB_REF#refs/tags/engine-v}"
          fi
          case "$tag" in
            *refs/*|"") echo "::error::could not resolve a valid version (got '$tag')"; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          # Build context is the repo root (the merged monorepo has one root
          # bun.lock; the engine Dockerfile compiles a self-contained binary).
          context: .
          file: engine/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          # No attestation manifests in the index: buildx provenance/SBOM add
          # `unknown/unknown` manifests Fly's resolver can't parse, making it
          # report "found arm64". Keep the index to just the platform images.
          provenance: false
          sbom: false
          push: true
          tags: |
            midplane/midplane:${{ steps.version.outputs.tag }}
            midplane/midplane:latest
            ghcr.io/midplaneai/midplane:${{ steps.version.outputs.tag }}
            ghcr.io/midplaneai/midplane:latest

  # The `midplane` npm package — the `npx midplane` path and the artifact the
  # registry's npm block points at.
  npm:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm provenance: the attestation is signed with this workflow's OIDC
      # identity, so `npm view midplane` shows the commit and workflow the
      # tarball was built from. For a security tool that is worth having.
      id-token: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: probe
          POSTGRES_DB: probe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile

      # A published npm version is immutable. Everything that can be checked
      # before that point is checked before that point.
      - name: Assert the tag matches the manifests
        env:
          TAG: ${{ needs.publish.outputs.version }}
        run: |
          manifest="$(node -p 'require("./engine/packages/mcp-server/package.json").version')"
          if [ "$manifest" != "$TAG" ]; then
            echo "::error::tag engine-v$TAG does not match package.json version $manifest"
            exit 1
          fi
          # Holds package.json, server.json, the Dockerfile annotation, and
          # OSS_ENGINE_IMAGE to one version and one server name.
          bun scripts/check-image-pin.ts
          bun scripts/check-server-json.ts

      - name: Build the package
        run: bun engine/packages/mcp-server/scripts/build-npm.ts

      - name: Smoke the built package under Node
        working-directory: engine/packages/mcp-server
        env:
          SMOKE_DATABASE_URL: postgres://postgres:probe@127.0.0.1:5432/probe
        run: node scripts/smoke-npm-package.mjs

      - name: Publish to npm
        working-directory: engine/packages/mcp-server
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # --access public is REQUIRED, not redundant. It looks redundant —
        # `midplane` is unscoped and unscoped packages are always public — but
        # npm refuses outright without it:
        #
        #   npm error Can't generate provenance for new or private package,
        #   you must set `access` to public.
        #
        # That refusal is also the explanation for the 403 this workflow hit on
        # its first two attempts. Creating a package REQUIRES setting its
        # access, and as of early August 2026 npm tokens with bypass-2FA may no
        # longer change package access
        # (https://gh.io/npm-gat-bypass2fa-deprecation). The two constraints
        # meet: a bypass-2FA token cannot create a new package with provenance,
        # and dropping the flag to dodge the restriction just trades the 403 for
        # a hard EUSAGE.
        #
        # So the FIRST publish of a package has to come from a real 2FA session
        # (an interactive `npm publish --access public --no-provenance`). Once
        # the package exists its access is already public, later publishes
        # change nothing, and this command works — best via trusted publishing
        # (OIDC), which has no token to be restricted in the first place.
        #
        # --provenance is also set in package.json publishConfig; passing it
        # here makes the requirement visible at the call site.
        run: npm publish --provenance --access public

  # The official MCP registry entry. Metadata only — it points at the npm
  # package and the image published above, and the registry verifies both
  # before accepting it (npm: the `mcpName` field; OCI: the
  # io.modelcontextprotocol.server.name annotation).
  registry:
    needs: [publish, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      # npm's CDN is not read-your-writes. Publishing the registry entry
      # against a version the registry's validator cannot fetch yet fails the
      # release for a reason that has nothing to do with the release.
      - name: Wait for the npm version to be resolvable
        env:
          TAG: ${{ needs.publish.outputs.version }}
        run: |
          for i in $(seq 1 30); do
            if npm view "midplane@$TAG" version >/dev/null 2>&1; then
              echo "midplane@$TAG is live on npm"
              exit 0
            fi
            echo "waiting for midplane@$TAG on npm ($i/30)"
            sleep 10
          done
          echo "::error::midplane@$TAG did not appear on npm within 5 minutes"
          exit 1

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/').tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher --help >/dev/null

      # DNS auth over GitHub OIDC: the namespace is ai.midplane/*, which is
      # ours by virtue of owning midplane.ai, not by virtue of the GitHub org.
      # github-oidc would only grant io.github.midplaneai/*.
      - name: Publish the registry entry
        env:
          MCP_DNS_KEY: ${{ secrets.MCP_REGISTRY_DNS_PRIVATE_KEY }}
        run: |
          ./mcp-publisher login dns --domain midplane.ai --private-key "$MCP_DNS_KEY"
          ./mcp-publisher publish
