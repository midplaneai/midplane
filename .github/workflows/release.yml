name: release

# A tagged release, from the public repository, so npm's provenance and the
# image's signature name public source. On a tag vX.Y.Z, on main, equal to
# apps/gateway/package.json's version, after CI passes:
#
#   - build (no publishing rights): pack the gateway once, with its
#     dependency tree pinned in npm-shrinkwrap.json, and run the package
#     smoke test on that very tarball and on an image built from it;
#   - publish (the `release` environment): publish that tarball to npm with
#     provenance through trusted publishing (GitHub's OIDC token, no npm
#     token), push the image ghcr.io/midplaneai/midplane:X.Y.Z for amd64 and
#     arm64 built from it, with an SBOM and build provenance, and sign it
#     keyless with cosign. This job installs and runs no dependencies.
#
# How to verify both: docs/releases.md. Actions are pinned by commit.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          require-lockfile: true

      - name: The tag must be the package's version, on main
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./apps/gateway/package.json').version")
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "apps/gateway/package.json's version isn't X.Y.Z: $version" >&2
            exit 1
          fi
          if [ "v$version" != "$TAG" ]; then
            echo "tag $TAG doesn't match apps/gateway/package.json ($version)" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag $TAG isn't on main" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Pack once, with the dependency tree pinned
        run: |
          node apps/gateway/scripts/build.ts --shrinkwrap
          mkdir -p image
          (cd apps/gateway && pnpm pack --pack-destination ../../image)

      - name: Smoke-test this tarball and an image built from it
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker compose -f examples/quickstart/compose.yaml up -d --wait
          docker build --build-arg "TARBALL=image/midplane-$VERSION.tgz" -t midplane:release .
          node apps/gateway/scripts/package-smoke.ts --tarball "image/midplane-$VERSION.tgz" --image midplane:release

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tarball
          path: image/midplane-${{ steps.version.outputs.version }}.tgz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      # npm provenance and trusted publishing, and cosign's keyless signing.
      id-token: write
      # The image, to GHCR.
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/midplane
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      # The Dockerfile; nothing from the checkout is installed or run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tarball
          path: image
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Publish the tested tarball to npm, with provenance
        run: npm publish "image/midplane-$VERSION.tgz" --provenance --access public

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image from it, with an SBOM and provenance
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: TARBALL=image/midplane-${{ env.VERSION }}.tgz
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          push: true
          sbom: true
          provenance: mode=max

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image, keyless
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
