    <path fill="#B4460C" d="M154.47 66.66Q150.44 66.66 148.01 64.24Q145.59 61.81 145.59 57.78Q145.59 53.74 148.01 51.32Q150.44 48.89 154.47 48.89Q158.51 48.89 160.94 51.32Q163.36 53.74 163.36 57.78Q163.36 61.81 160.94 64.24Q158.51 66.66 154.47 66.66ZM154.47 40.13Q150.44 40.13 148.01 37.7Q145.59 35.28 145.59 31.24Q145.59 27.21 148.01 24.78Q150.44 22.36 154.47 22.36Q158.51 22.36 160.94 24.78Q163.36 27.21 163.36 31.24Q163.36 35.28 160.94 37.7Q158.51 40.13 154.47 40.13Z"/>
  </g>
  <text class="caption center" x="710" y="110">Checks every statement against your policy</text>
  <text class="caption center" x="710" y="134">and records it before it runs</text>

  <!-- Statement lines. Allowed ones cross the plane and run on to Postgres;
       the others end at their verdict, against the plane. -->
  <path class="line" d="M444 220 H992 C1020 220 1012 270 1036 270 H1052" marker-end="url(#head)"/>
  <path class="line" d="M444 380 H992 C1020 380 1012 330 1036 330 H1052" marker-end="url(#head)"/>
  <path class="line" d="M444 300 H558" marker-end="url(#head)"/>
  <path class="line" d="M444 460 H482" marker-end="url(#head)"/>
  <path class="line" d="M444 540 H558" marker-end="url(#head)"/>

  <!-- The plane -->
  <path d="M670 156 L750 184 V576 L670 604 Z" fill="url(#face)"/>
  <path d="M670 156 V604" stroke="#3A5361" stroke-width="2" fill="none"/>
  <path class="through" d="M670 220 H750 M670 380 H750"/>

  <!-- Statements -->
  <g filter="url(#shadow)">
    <rect class="pill" x="40" y="198" width="404" height="44" rx="9"/>
    <rect class="pill" x="40" y="278" width="404" height="44" rx="9"/>
    <rect class="pill" x="40" y="358" width="404" height="44" rx="9"/>
    <rect class="pill" x="40" y="438" width="404" height="44" rx="9"/>
    <rect class="pill" x="40" y="518" width="404" height="44" rx="9"/>
  </g>
  <text class="sql" x="57" y="226">SELECT plan FROM customers</text>
  <text class="sql" x="57" y="306">SELECT * FROM api_keys</text>
  <text class="sql" x="57" y="386">SELECT email FROM customers</text>
  <text class="sql" x="57" y="466">DELETE FROM orders WHERE id = 7</text>
  <text class="sql" x="57" y="546">DROP TABLE orders</text>

  <!-- Verdicts that pass, past the plane -->
  <rect x="764" y="203" width="114" height="34" rx="17" fill="#DCEBE2"/>
  <text class="chip" x="821" y="226" style="fill:#1F5039">Answered</text>
  <rect x="764" y="363" width="229" height="34" rx="17" fill="#DCE6EF"/>
  <text class="chip" x="878.5" y="386" style="fill:#274866">Answered, fields hidden</text>
  <text class="note" x="764" y="424">Emails hashed</text>

  <!-- Verdicts that stop, against the plane -->
  <rect x="560" y="283" width="96" height="34" rx="17" fill="#B4460C"/>
  <text class="chip" x="608" y="306" style="fill:#FFFFFF">Blocked</text>
  <text class="note end" x="656" y="344">Table not open to agents</text>
  <rect x="484" y="443" width="172" height="34" rx="17" fill="#FBE9DF"/>
  <text class="chip" x="570" y="466" style="fill:#8A3409">Held for approval</text>
  <text class="note end" x="656" y="504">Waits for your OK</text>
  <rect x="560" y="523" width="96" height="34" rx="17" fill="#B4460C"/>
  <text class="chip" x="608" y="546" style="fill:#FFFFFF">Blocked</text>
  <text class="note end" x="656" y="584">Schema changes denied</text>

  <!-- Postgres -->
  <g class="icon">
    <path d="M1054 254 v92 c0 10 25 18 56 18 s56 -8 56 -18 v-92" fill="#F8FAF8"/>
    <ellipse cx="1110" cy="254" rx="56" ry="17" fill="#F8FAF8"/>
    <path d="M1054 285 c0 10 25 18 56 18 s56 -8 56 -18 M1054 316 c0 10 25 18 56 18 s56 -8 56 -18"/>
  </g>
  <text class="title center" x="1110" y="406">Postgres</text>
</svg>
