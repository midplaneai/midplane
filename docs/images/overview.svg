<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">What Midplane does</title>
  <desc id="desc">An AI agent sends five statements, and Midplane, drawn as a plane between the agent and Postgres, checks each one against your policy and records it before it runs. Two reads pass through to Postgres: one is answered, the other answered with its emails hashed. Three stop at Midplane: a read of the api_keys table is blocked because the table is not open to agents, a delete waits for your approval, and dropping the orders table is blocked because schema changes are denied.</desc>
  <defs>
    <style>
      text { font-family: "Schibsted Grotesk", sans-serif; fill: #0F1F29; }
      .title { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
      .caption { font-size: 19px; font-weight: 400; fill: #4A5A63; }
      .note { font-size: 18px; font-weight: 400; fill: #4A5A63; }
      .sql { font-family: "Martian Mono", monospace; font-size: 17px; }
      .chip { font-size: 17px; font-weight: 700; text-anchor: middle; }
      .center { text-anchor: middle; }
      .end { text-anchor: end; }
      .pill { fill: #F8FAF8; stroke: #D6DDD8; stroke-width: 1.5; }
      .line { fill: none; stroke: #0F1F29; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .through { fill: none; stroke: #F3F6F4; stroke-width: 2.5; stroke-linecap: round; opacity: 0.55; }
      .icon { fill: none; stroke: #0F1F29; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="head" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="12" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 Z" fill="#0F1F29"/>
    </marker>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1E3441"/>
      <stop offset="1" stop-color="#0F1F29"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#0F1F29" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#EEF2EF"/>

  <!-- Headings: the agent, and Midplane above its plane. -->
  <g class="icon">
    <path d="M46 48 h42 a6 6 0 0 1 6 6 v28 a6 6 0 0 1 -6 6 h-28 l-10 9 v-9 h-4 a6 6 0 0 1 -6 -6 v-28 a6 6 0 0 1 6 -6 z"/>
    <path d="M53 60 l7 7 -7 7 M66 74 h12"/>
  </g>
  <text class="title" x="112" y="78">AI agent</text>
  <text class="caption" x="112" y="106">Claude Code, Cursor, any MCP client</text>

  <g transform="translate(629.4 44) scale(0.42)">
