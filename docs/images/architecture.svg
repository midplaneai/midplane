<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="826" viewBox="0 0 1200 826" role="img" aria-labelledby="title desc">
  <title id="title">How Midplane connects</title>
  <desc id="desc">An AI agent connects over MCP to Midplane's relay; its queries and results are encrypted end to end, and the relay forwards them without being able to read them. In your network, the Midplane gateway checks, records and runs each statement, writes it to the audit log before it runs, and queries Postgres as its own role. Both of its other connections are outbound: to the relay, which agents' traffic comes in over, and to Midplane Cloud, which gets the query log with values removed and sends signed policies and approvals. Midplane Cloud gets no query results and no credentials.</desc>
  <defs>
    <style>
      text { font-family: "Schibsted Grotesk", sans-serif; fill: #0F1F29; }
      .title { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
      .region { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
      .label { font-size: 20px; font-weight: 700; }
      .caption { font-size: 19px; font-weight: 400; fill: #4A5A63; }
      .chip-label { font-size: 19px; font-weight: 700; fill: #F3F6F4; }
      .center { text-anchor: middle; }
      .card { fill: #F8FAF8; stroke: #D6DDD8; stroke-width: 1.5; }
      .boundary { fill: none; stroke: #9AA7A0; stroke-width: 1.5; stroke-dasharray: 8 6; }
      .line { fill: none; stroke: #0F1F29; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .icon { fill: none; stroke: #0F1F29; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .glyph { fill: none; stroke: #4A5A63; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .chip { fill: #1E3441; stroke: #3A5361; stroke-width: 1.5; }
    </style>
    <marker id="head" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="12" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 Z" fill="#0F1F29"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#0F1F29" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="1200" height="826" fill="#EEF2EF"/>

  <!-- Outside your network: the agent, the relay and Midplane Cloud share one row. -->

  <!-- AI agent -->
  <rect class="card" x="40" y="40" width="236" height="200" rx="12" filter="url(#shadow)"/>
  <g class="icon">
    <path d="M137 62 h42 a6 6 0 0 1 6 6 v28 a6 6 0 0 1 -6 6 h-28 l-10 9 v-9 h-4 a6 6 0 0 1 -6 -6 v-28 a6 6 0 0 1 6 -6 z"/>
    <path d="M144 74 l7 7 -7 7 M157 88 h12"/>
  </g>
  <text class="title center" x="158" y="158">AI agent</text>
  <text class="caption center" x="158" y="190">Claude Code, Cursor,</text>
  <text class="caption center" x="158" y="215">any MCP client</text>

  <!-- Agent to relay -->
  <path class="line" d="M277 140 H499" marker-end="url(#head)"/>
  <text class="label center" x="388" y="126">MCP</text>
  <text class="caption center" x="388" y="170">Queries and results,</text>
  <text class="caption center" x="388" y="194">encrypted end to end</text>

  <!-- Midplane relay -->
  <rect class="card" x="500" y="40" width="290" height="200" rx="12" filter="url(#shadow)"/>
  <g class="icon">
    <path d="M621 74 h48 m-9 -9 l9 9 -9 9"/>
    <path d="M669 96 h-48 m9 -9 l-9 9 9 9"/>
  </g>
  <text class="title center" x="645" y="158">Midplane relay</text>
  <text class="caption center" x="645" y="190">Forwards encrypted traffic,</text>
  <text class="caption center" x="645" y="215">can’t read it</text>

  <!-- Midplane Cloud -->
  <rect class="card" x="860" y="40" width="300" height="200" rx="12" filter="url(#shadow)"/>
  <g class="icon">
    <path d="M993 106 h34 a13 13 0 0 0 2 -25.8 a17 17 0 0 0 -32.5 -3.4 a12.5 12.5 0 0 0 -3.5 29.2 z"/>
  </g>
  <text class="title center" x="1010" y="158">Midplane Cloud</text>
  <text class="caption center" x="1010" y="190">Policy · Approvals · Query log</text>

  <!-- Your network -->
  <rect class="boundary" x="40" y="392" width="1120" height="394" rx="14"/>
  <text class="region" x="64" y="428">Your network</text>

  <!-- The gateway opens both connections out: arrows point the way each connection is opened. -->
  <path class="line" d="M645 416 V241" marker-end="url(#head)"/>
  <text class="label" x="487" y="286">Outbound</text>
  <text class="caption" x="487" y="312">Agents’ traffic</text>
  <text class="caption" x="487" y="336">comes in over it</text>

  <path class="line" d="M1010 416 V241" marker-end="url(#head)"/>
  <text class="label" x="733" y="286">Outbound</text>
  <path class="glyph" d="M739 314 v-13 m-4.5 4.5 l4.5 -4.5 4.5 4.5"/>
  <text class="caption" x="753" y="312">Query log, values removed</text>
  <path class="glyph" d="M739 324 v13 m-4.5 -4.5 l4.5 4.5 4.5 -4.5"/>
  <text class="caption" x="753" y="337">Signed policies, approvals</text>
  <text class="label" x="733" y="365">No results, no credentials</text>

  <!-- Midplane gateway -->
  <rect x="585" y="416" width="485" height="168" rx="13" fill="#0F1F29"/>
  <text class="title center" x="827.5" y="464" style="fill:#F3F6F4">Midplane gateway</text>
  <rect class="chip" x="624" y="494" width="112" height="60" rx="9"/>
  <rect class="chip" x="772" y="494" width="112" height="60" rx="9"/>
  <rect class="chip" x="920" y="494" width="112" height="60" rx="9"/>
  <text class="chip-label center" x="680" y="531">Check</text>
  <text class="chip-label center" x="828" y="531">Record</text>
  <text class="chip-label center" x="976" y="531">Run</text>
  <path d="M745 524 h18 m-6 -6 l6 6 -6 6 M893 524 h18 m-6 -6 l6 6 -6 6" fill="none" stroke="#F3F6F4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Gateway to Postgres -->
  <path class="line" d="M585 524 H232" marker-end="url(#head)"/>
  <text class="label center" x="408" y="510">SQL, as its own role</text>
  <g class="icon">
    <path d="M98 474 v92 c0 10 27 18 60 18 s60 -8 60 -18 v-92" fill="#F8FAF8"/>
    <ellipse cx="158" cy="474" rx="60" ry="18" fill="#F8FAF8"/>
    <path d="M98 505 c0 10 27 18 60 18 s60 -8 60 -18 M98 536 c0 10 27 18 60 18 s60 -8 60 -18"/>
  </g>
  <text class="title center" x="158" y="624">Postgres</text>

  <!-- Audit log -->
  <path class="line" d="M827.5 584 V622"/>
  <g class="icon">
    <path d="M806 624 h30 l14 14 v50 a6 6 0 0 1 -6 6 h-38 a6 6 0 0 1 -6 -6 v-58 a6 6 0 0 1 6 -6 z" fill="#F8FAF8"/>
    <path d="M836 624 v14 h14 M810 654 h28 M810 667 h28 M810 680 h19"/>
  </g>
  <text class="label center" x="827.5" y="728">Audit log</text>
  <text class="caption center" x="827.5" y="754">Every statement, before it runs</text>
</svg>
